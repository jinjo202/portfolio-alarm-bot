name: Daily Digest

# 메인 배포는 맥미니 launchd(com.portfolio-alarm-bot.daily.plist, 매일 07:30 KST) — Codex CLI 구독 요약, API 과금 없음.
# 여긴 수동 테스트용 보조 경로만 남긴다(schedule 트리거 없음, 중복 발송 방지).
# sent.json(중복방지 상태)은 실행 후 커밋백.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HOLDINGS_JSON: ${{ secrets.HOLDINGS_JSON }}
        run: python bot.py

      - name: Commit sent.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent.json
          git diff --staged --quiet && exit 0
          git commit -m "auto: sent state $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main && git push
